name: Move V2 engine server-side
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/move-v2-engine-server.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move scoring logic to Supabase
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('v2/index.html')
          s = p.read_text()

          # Retire les pondérations du code public des questions.
          s = re.sub(r",w:\{[^{}]*\}", "", s)

          start = s.find('function norm(v){')
          end = s.find('function current(){', start)
          if start < 0 or end < 0:
              raise SystemExit('Scoring block not found')

          server_logic = """const ENGINE_ENDPOINT='https://hrmeduxnxsxklklmtmgo.supabase.co/functions/v1/operation-com-prevention-engine';let serverResult=null;async function buildAdaptive(){const btn=$('next');btn.disabled=true;btn.textContent='Analyse…';try{const r=await fetch(ENGINE_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'adaptive',answers})});if(!r.ok)throw new Error('engine');const data=await r.json();const lookup=Object.fromEntries([...CORE,...Object.values(FOLLOW).flat()].map(q=>[q.id,q]));queue=(data.questionIds||[]).map(id=>lookup[id]).filter(Boolean);if(!queue.length){renderHistory();return}idx=0;phase='adaptive';adaptiveBuilt=true;render()}catch(e){$('qsub').textContent='Le calcul est momentanément indisponible. Réessayez dans quelques instants.';btn.disabled=false;btn.textContent='Réessayer'}}"""
          s = s[:start] + server_logic + s[end:]

          rstart = s.find('function result(){')
          rend = s.find('function proSummary(){', rstart)
          if rstart < 0 or rend < 0:
              raise SystemExit('Result block not found')

          result_logic = """async function result(){const r=await fetch(ENGINE_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'result',answers,history})});if(!r.ok)throw new Error('engine_result');const data=await r.json();serverResult=data;$('num').innerHTML=data.balance+'<span>/100</span>';$('status').textContent=data.status;$('statusText').textContent=data.statusText;const balanced=data.balancedCount,needs=data.needsCount;$('balanceSummary').innerHTML='<div class=\"summaryBox ok\"><strong>'+balanced+'</strong><span>axe'+(balanced>1?'s':'')+' équilibré'+(balanced>1?'s':'')+'</span></div><div class=\"summaryBox warn\"><strong>'+needs+'</strong><span>axe'+(needs>1?'s':'')+' à rééquilibrer</span></div>';$('cards').innerHTML='';[...(data.axes||[])].sort((a,b)=>(b.score>=30)-(a.score>=30)||b.score-a.score).forEach(a=>{const n=a.score>=30,c=document.createElement('div');c.className='card '+(n?'needs':'balanced');c.innerHTML='<div class=\"cardtop\"><b>'+a.name+'</b>'+(n?'<span class=\"axisScore\" style=\"color:var(--warn)\">'+a.score+'%</span>':'')+'</div><span class=\"tag '+(n?'warn':'ok')+'\">'+(n?'● Axe nécessitant un rééquilibrage':'✓ Axe équilibré')+'</span>'+(n?'<div class=\"why\">'+a.why+'</div>':'');$('cards').appendChild(c)});show('results')}"""
          s = s[:rstart] + result_logic + s[rend:]

          pstart = s.find('function proSummary(){')
          pend = s.find("$('start').onclick", pstart)
          if pstart < 0 or pend < 0:
              raise SystemExit('Summary block not found')
          summary_logic = "function proSummary(){return serverResult?.proSummary||'Résultat indisponible.'}"
          s = s[:pstart] + summary_logic + s[pend:]

          s = s.replace("if(!r.ok)throw new Error('save');result()", "if(!r.ok)throw new Error('save');await result()", 1)

          # Vérifications : aucun poids ni ancien moteur local ne doit rester.
          forbidden = ['w:{qi:', 'w:{yang:', 'function rawScores', 'function finalScores', 'function mtc(', 'function patientAxes(']
          for token in forbidden:
              if token in s:
                  raise SystemExit('Public scoring logic still present: '+token)

          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/index.html
          git diff --cached --quiet || git commit -m 'Déplace le moteur de calcul V2 côté Supabase'
          git push
