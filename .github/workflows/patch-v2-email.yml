name: Patch V2 contact email
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v2-email.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update recipient
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('v2/index.html')
          s = p.read_text()
          s = s.replace('centrekokoro@gmail.com', 'th.clement.gigout@gmail.com')
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/index.html
          git diff --cached --quiet || git commit -m 'Corrige adresse email des résultats V2'
          git push
