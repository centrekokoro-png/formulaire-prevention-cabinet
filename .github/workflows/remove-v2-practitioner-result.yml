name: Remove V2 practitioner result
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-v2-practitioner-result.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove practitioner result block
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('v2/index.html')
          s = p.read_text()
          block = '<details class="tech"><summary>Résultat praticien — hypothèses MTC</summary><div id="techBody" class="techBody"></div></details>'
          if block not in s:
              raise SystemExit('Practitioner block not found')
          s = s.replace(block, '', 1)
          s, n = re.subn(r"\$\('techBody'\)\.innerHTML=.*?;show\('results'\)", "show('results')", s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('techBody result assignment not found')
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/index.html
          git diff --cached --quiet || git commit -m 'Supprime le résultat praticien de la page finale V2'
          git push
