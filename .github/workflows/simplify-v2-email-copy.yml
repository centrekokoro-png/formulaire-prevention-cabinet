name: Simplify V2 email copy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/simplify-v2-email-copy.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify email gate copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('v2/index.html')
          s = p.read_text()
          old = '<p>Elle sera enregistrée par le cabinet pour ce pré-bilan. Vos réponses et hypothèses MTC ne sont pas enregistrées.</p>'
          if old not in s:
              raise SystemExit('Email explanatory paragraph not found')
          s = s.replace(old, '', 1)
          old2 = 'J’accepte que mon adresse e-mail soit enregistrée par le cabinet dans le cadre de ce pré-bilan. Aucun abonnement automatique à une newsletter.'
          new2 = 'J’accepte que mon adresse e-mail soit enregistrée dans le cadre de ce pré-bilan.'
          if old2 not in s:
              raise SystemExit('Consent copy not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/index.html
          git diff --cached --quiet || git commit -m 'Simplifie le texte de collecte email V2'
          git push
